name: Syrinx app release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated version tag to build
        required: true
        type: string

permissions: {}

concurrency:
  group: syrinx-app-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-build.outputs.artifact-digest }}
    env:
      RELEASE_REPO_ROOT: ${{ github.workspace }}
      RELEASE_OUTPUT_DIR: ${{ runner.temp }}/syrinx-app-build-input
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_APPLICATION_IDENTITY: ${{ vars.RELEASE_APPLICATION_IDENTITY }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | /usr/bin/cut -d. -f1)" -ge 14

      - name: Resolve checked-out source commit
        run: echo "RELEASE_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate app source and release inputs
        run: python3 scripts/release/app-release.py validate-source

      - name: Test client package
        run: swift test --package-path parrot --disable-sandbox

      - name: Clean-source audit
        run: ./scripts/clean-source-audit.sh

      - name: Validate app release workflow
        run: ./scripts/release/validate-workflow.sh

      - name: Build exact unsigned Syrinx.app input
        run: python3 scripts/release/app-release.py build --swift-build --unsigned-dry-run

      - name: Create immutable app artifact handoff
        run: |
          python3 scripts/release/app-release.py create-handoff \
            --input-dir "$RELEASE_OUTPUT_DIR" \
            --output-dir "$RUNNER_TEMP/syrinx-app-build-handoff"

      - id: upload-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syrinx-app-build-input
          path: ${{ runner.temp }}/syrinx-app-build-handoff
          if-no-files-found: error
          retention-days: 7

  sign-notarize:
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_REPO_ROOT: ${{ github.workspace }}
      RELEASE_OUTPUT_DIR: ${{ runner.temp }}/syrinx-app-signed
      RELEASE_BUILD_ARTIFACT_ID: ${{ needs.build-verify.outputs.artifact-id }}
      RELEASE_BUILD_ARTIFACT_DIGEST: ${{ needs.build-verify.outputs.artifact-digest }}
      RELEASE_BUILD_ARCHIVE: ${{ runner.temp }}/syrinx-app-build-input.zip
      RELEASE_BUILD_EXTRACTED_DIR: ${{ runner.temp }}/syrinx-app-build-extracted
      RELEASE_BUILD_HANDOFF_STATE: ${{ runner.temp }}/syrinx-app-build-handoff.json
      RELEASE_BUILD_SNAPSHOT_DIR: ${{ runner.temp }}/syrinx-app-build-snapshot
      RELEASE_BUILD_SNAPSHOT_STATE: ${{ runner.temp }}/syrinx-app-build-snapshot.json
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_APPLICATION_IDENTITY: ${{ vars.RELEASE_APPLICATION_IDENTITY }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
      RELEASE_SIGNING_STATE: ${{ runner.temp }}/syrinx-signing-state.json
      RELEASE_SIGNING_KEYCHAIN: ${{ runner.temp }}/syrinx-signing.keychain-db
      RELEASE_TRUSTED_SIGNING_KEYCHAIN: ${{ runner.temp }}/syrinx-signing.keychain-db
      RELEASE_SIGNING_CLEANUP_PLAN: ${{ runner.temp }}/syrinx-signing-cleanup-plan.json
      RELEASE_APPLICATION_CERTIFICATE_PATH: ${{ runner.temp }}/syrinx-application.p12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | /usr/bin/cut -d. -f1)" -ge 14

      - name: Resolve checked-out source commit
        run: echo "RELEASE_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch and verify exact build artifact handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py verify-artifact-handoff

      - name: Import verified unsigned app input
        run: |
          python3 scripts/release/app-release.py import-handoff \
            --input-dir "$RELEASE_BUILD_SNAPSHOT_DIR" \
            --output-dir "$RELEASE_OUTPUT_DIR"

      - name: Prepare temporary signing keychain and notary profile
        env:
          RELEASE_NOTARY_PROFILE: ${{ vars.RELEASE_NOTARY_PROFILE }}
          RELEASE_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.RELEASE_APPLICATION_CERTIFICATE_BASE64 }}
          RELEASE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_APPLICATION_CERTIFICATE_PASSWORD }}
          RELEASE_NOTARY_CREDENTIALS_BASE64: ${{ secrets.RELEASE_NOTARY_CREDENTIALS_BASE64 }}
        run: python3 scripts/release/release.py prepare-signing --application-only

      - name: Sign, notarize, staple, and verify Syrinx.app
        env:
          RELEASE_NOTARY_PROFILE: ${{ vars.RELEASE_NOTARY_PROFILE }}
        run: python3 scripts/release/app-release.py sign-input

      - id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: syrinx-app-release-assets
          path: ${{ env.RELEASE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        env:
          RELEASE_NOTARY_PROFILE: ${{ vars.RELEASE_NOTARY_PROFILE }}
        run: python3 scripts/release/release.py cleanup-signing

  publish:
    needs: sign-notarize
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_REPO_ROOT: ${{ github.workspace }}
      RELEASE_OUTPUT_DIR: ${{ runner.temp }}/syrinx-app-release-assets
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_APPLICATION_IDENTITY: ${{ vars.RELEASE_APPLICATION_IDENTITY }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | /usr/bin/cut -d. -f1)" -ge 14

      - name: Resolve checked-out source commit
        run: echo "RELEASE_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fetch signed app release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: syrinx-app-release-assets
          path: ${{ env.RELEASE_OUTPUT_DIR }}

      - name: Reverify signed and notarized Syrinx.app
        run: python3 scripts/release/app-release.py verify --signed

      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2
        with:
          subject-path: ${{ env.RELEASE_OUTPUT_DIR }}/*

      - name: Publish Syrinx.app release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            "$RELEASE_OUTPUT_DIR/Syrinx-$RELEASE_VERSION.zip" \
            "$RELEASE_OUTPUT_DIR/Syrinx-$RELEASE_VERSION.metadata.json" \
            "$RELEASE_OUTPUT_DIR/Syrinx-$RELEASE_VERSION.notary.json" \
            "$RELEASE_OUTPUT_DIR/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Syrinx $RELEASE_VERSION" \
            --notes "Download Syrinx.app, move it to Applications, open it, grant Microphone and Accessibility access, and hold Fn to dictate."
