name: Trusted native release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Exact annotated version tag to build
        required: true
        type: string

permissions: {}

concurrency:
  group: trusted-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-verify:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # macos-26 is the current Swift 6-capable Apple Silicon runner.
    # https://github.com/actions/runner-images/blob/main/images/macos/macos-26-arm64-Readme.md
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload-build.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-build.outputs.artifact-digest }}
    env:
      RELEASE_REPO_ROOT: ${{ github.workspace }}
      RELEASE_OUTPUT_DIR: ${{ runner.temp }}/trusted-release-build-input
      RELEASE_PRODUCT_IDENTITY: ${{ vars.RELEASE_PRODUCT_IDENTITY }}
      RELEASE_EXECUTABLE: ${{ vars.RELEASE_EXECUTABLE }}
      RELEASE_PACKAGE_ID: ${{ vars.RELEASE_PACKAGE_ID }}
      RELEASE_SERVICE_LABEL: ${{ vars.RELEASE_SERVICE_LABEL }}
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_SOURCE_COMMIT: ''
      RELEASE_APPLICATION_IDENTITY: ${{ vars.RELEASE_APPLICATION_IDENTITY }}
      RELEASE_INSTALLER_IDENTITY: ${{ vars.RELEASE_INSTALLER_IDENTITY }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
      RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
      RELEASE_SECURITY_CONTACT: ${{ vars.RELEASE_SECURITY_CONTACT }}
      RELEASE_REPOSITORY_URL: ${{ vars.RELEASE_REPOSITORY_URL }}
      RELEASE_SOURCE_LICENSE: LICENSE
      RELEASE_NOTICES: THIRD_PARTY_NOTICES.md
      RELEASE_LICENSES_DIR: LICENSES
      RELEASE_MODEL_MANIFEST: ModelManifests/parakeet-tdt-0.6b-v3-int8.json
      RELEASE_EMBEDDED_MODEL_MANIFEST: Sources/SyrinxCore/Resources/parakeet-tdt-0.6b-v3-int8.json
      RELEASE_COMPATIBILITY: COMPATIBILITY.md
      RELEASE_SUPPORT: SUPPORT.md
      RELEASE_CHANGELOG: CHANGELOG.md
    steps:
      # actions/checkout v4, reviewed immutable commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | /usr/bin/cut -d. -f1)" -ge 14

      - name: Resolve checked-out annotated tag target
        run: python3 scripts/release/release.py resolve-source

      - name: Validate exact source and release inputs
        run: python3 scripts/release/release.py validate-source

      - name: Resolve and lock Swift dependencies
        run: |
          before="$(shasum -a 256 Package.resolved | /usr/bin/awk '{print $1}')"
          swift package resolve
          after="$(shasum -a 256 Package.resolved | /usr/bin/awk '{print $1}')"
          test "$before" = "$after"

      - name: Test Swift package
        run: swift test --disable-sandbox

      - name: Clean-source audit
        run: ./scripts/clean-source-audit.sh

      - name: Validate release workflow
        run: ./scripts/release/validate-workflow.sh

      - name: Build exact unsigned input
        run: python3 scripts/release/release.py build --swift-build --unsigned-dry-run

      # actions/upload-artifact v4.6.2, reviewed immutable commit.
      - id: upload-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-release-build-input
          path: ${{ env.RELEASE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 7

  sign-notarize:
    needs: build-verify
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
      actions: read
    env:
      RELEASE_REPO_ROOT: ${{ github.workspace }}
      RELEASE_OUTPUT_DIR: ${{ runner.temp }}/trusted-release-snapshot
      RELEASE_BUILD_ARTIFACT_ID: ${{ needs.build-verify.outputs.artifact-id }}
      RELEASE_BUILD_ARTIFACT_DIGEST: ${{ needs.build-verify.outputs.artifact-digest }}
      RELEASE_BUILD_ARCHIVE: ${{ runner.temp }}/trusted-release-build-input.zip
      RELEASE_BUILD_EXTRACTED_DIR: ${{ runner.temp }}/trusted-release-extracted
      RELEASE_BUILD_SNAPSHOT_DIR: ${{ runner.temp }}/trusted-release-snapshot
      RELEASE_BUILD_HANDOFF_STATE: ${{ runner.temp }}/trusted-release-build-handoff.json
      RELEASE_BUILD_SNAPSHOT_STATE: ${{ runner.temp }}/trusted-release-build-snapshot.json
      RELEASE_PRODUCT_IDENTITY: ${{ vars.RELEASE_PRODUCT_IDENTITY }}
      RELEASE_EXECUTABLE: ${{ vars.RELEASE_EXECUTABLE }}
      RELEASE_PACKAGE_ID: ${{ vars.RELEASE_PACKAGE_ID }}
      RELEASE_SERVICE_LABEL: ${{ vars.RELEASE_SERVICE_LABEL }}
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_APPLICATION_IDENTITY: ${{ vars.RELEASE_APPLICATION_IDENTITY }}
      RELEASE_INSTALLER_IDENTITY: ${{ vars.RELEASE_INSTALLER_IDENTITY }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
      RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
      RELEASE_SECURITY_CONTACT: ${{ vars.RELEASE_SECURITY_CONTACT }}
      RELEASE_REPOSITORY_URL: ${{ vars.RELEASE_REPOSITORY_URL }}
      RELEASE_SOURCE_LICENSE: LICENSE
      RELEASE_NOTICES: THIRD_PARTY_NOTICES.md
      RELEASE_LICENSES_DIR: LICENSES
      RELEASE_MODEL_MANIFEST: ModelManifests/parakeet-tdt-0.6b-v3-int8.json
      RELEASE_EMBEDDED_MODEL_MANIFEST: Sources/SyrinxCore/Resources/parakeet-tdt-0.6b-v3-int8.json
      RELEASE_COMPATIBILITY: COMPATIBILITY.md
      RELEASE_SUPPORT: SUPPORT.md
      RELEASE_CHANGELOG: CHANGELOG.md
      RELEASE_SIGNING_STATE: ${{ runner.temp }}/trusted-release-signing-state.json
      RELEASE_SIGNING_KEYCHAIN: ${{ runner.temp }}/trusted-release-signing.keychain-db
      RELEASE_TRUSTED_SIGNING_KEYCHAIN: ${{ runner.temp }}/trusted-release-signing.keychain-db
      RELEASE_SIGNING_CLEANUP_PLAN: ${{ runner.temp }}/trusted-release-signing-cleanup-plan.json
      RELEASE_APPLICATION_CERTIFICATE_PATH: ${{ runner.temp }}/trusted-release-application.p12
      RELEASE_INSTALLER_CERTIFICATE_PATH: ${{ runner.temp }}/trusted-release-installer.p12
      RELEASE_SIGNATURE_PRIVATE_KEY_PATH: ${{ runner.temp }}/trusted-release-signature-private.pem
      RELEASE_SIGNATURE_PUBLIC_KEY_PATH: ${{ runner.temp }}/trusted-release-signature-public.pem
    steps:
      # actions/checkout v4, reviewed immutable commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | /usr/bin/cut -d. -f1)" -ge 14

      - name: Resolve checked-out annotated tag target
        run: python3 scripts/release/release.py resolve-source

      - name: Fetch and verify exact build artifact archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/release/release.py verify-artifact-handoff

      - name: Reverify exact extracted build input
        run: python3 scripts/release/release.py verify --unsigned-dry-run

      - name: Prepare temporary signing keychain and notary profile
        env:
          RELEASE_NOTARY_PROFILE: ${{ vars.RELEASE_NOTARY_PROFILE }}
          RELEASE_APPLICATION_CERTIFICATE_BASE64: ${{ secrets.RELEASE_APPLICATION_CERTIFICATE_BASE64 }}
          RELEASE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.RELEASE_INSTALLER_CERTIFICATE_BASE64 }}
          RELEASE_APPLICATION_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_APPLICATION_CERTIFICATE_PASSWORD }}
          RELEASE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.RELEASE_INSTALLER_CERTIFICATE_PASSWORD }}
          RELEASE_NOTARY_CREDENTIALS_BASE64: ${{ secrets.RELEASE_NOTARY_CREDENTIALS_BASE64 }}
          RELEASE_SIGNATURE_PRIVATE_KEY_BASE64: ${{ secrets.RELEASE_SIGNATURE_PRIVATE_KEY_BASE64 }}
          RELEASE_SIGNATURE_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_SIGNATURE_PUBLIC_KEY_BASE64 }}
        run: python3 scripts/release/release.py prepare-signing

      - name: Sign, notarize, staple, and independently verify downloaded input
        env:
          RELEASE_NOTARY_PROFILE: ${{ vars.RELEASE_NOTARY_PROFILE }}
        run: python3 scripts/release/release.py sign-input

      # actions/upload-artifact v4.6.2, reviewed immutable commit.
      - id: upload-release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: trusted-release-assets
          path: ${{ env.RELEASE_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: ${{ always() }}
        env:
          RELEASE_NOTARY_PROFILE: ${{ vars.RELEASE_NOTARY_PROFILE }}
        run: python3 scripts/release/release.py cleanup-signing

  publish:
    needs: sign-notarize
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    environment: release-publish
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_REPO_ROOT: ${{ github.workspace }}
      RELEASE_OUTPUT_DIR: ${{ runner.temp }}/trusted-release
      RELEASE_PRODUCT_IDENTITY: ${{ vars.RELEASE_PRODUCT_IDENTITY }}
      RELEASE_EXECUTABLE: ${{ vars.RELEASE_EXECUTABLE }}
      RELEASE_PACKAGE_ID: ${{ vars.RELEASE_PACKAGE_ID }}
      RELEASE_SERVICE_LABEL: ${{ vars.RELEASE_SERVICE_LABEL }}
      RELEASE_VERSION: ${{ vars.RELEASE_VERSION }}
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      RELEASE_APPLICATION_IDENTITY: ${{ vars.RELEASE_APPLICATION_IDENTITY }}
      RELEASE_INSTALLER_IDENTITY: ${{ vars.RELEASE_INSTALLER_IDENTITY }}
      RELEASE_TEAM_ID: ${{ vars.RELEASE_TEAM_ID }}
      RELEASE_OWNER: ${{ vars.RELEASE_OWNER }}
      RELEASE_SECURITY_CONTACT: ${{ vars.RELEASE_SECURITY_CONTACT }}
      RELEASE_REPOSITORY_URL: ${{ vars.RELEASE_REPOSITORY_URL }}
      RELEASE_SOURCE_LICENSE: LICENSE
      RELEASE_NOTICES: THIRD_PARTY_NOTICES.md
      RELEASE_LICENSES_DIR: LICENSES
      RELEASE_MODEL_MANIFEST: ModelManifests/parakeet-tdt-0.6b-v3-int8.json
      RELEASE_EMBEDDED_MODEL_MANIFEST: Sources/SyrinxCore/Resources/parakeet-tdt-0.6b-v3-int8.json
      RELEASE_COMPATIBILITY: COMPATIBILITY.md
      RELEASE_SUPPORT: SUPPORT.md
      RELEASE_CHANGELOG: CHANGELOG.md
      RELEASE_SIGNING_STATE: ${{ runner.temp }}/trusted-release-verification-state.json
      RELEASE_SIGNATURE_PUBLIC_KEY_PATH: ${{ runner.temp }}/trusted-release-signature-public.pem
    steps:
      # actions/checkout v4, reviewed immutable commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Enforce protected Apple Silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | /usr/bin/cut -d. -f1)" -ge 14

      - name: Resolve checked-out annotated tag target
        run: python3 scripts/release/release.py resolve-source

      # actions/download-artifact v4, reviewed immutable commit.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: trusted-release-assets
          path: ${{ env.RELEASE_OUTPUT_DIR }}

      - name: Prepare detached-signature verification key
        env:
          RELEASE_SIGNATURE_PUBLIC_KEY_BASE64: ${{ secrets.RELEASE_SIGNATURE_PUBLIC_KEY_BASE64 }}
        run: python3 scripts/release/release.py prepare-verification

      - name: Reverify downloaded release bundle before attestation or publish
        run: python3 scripts/release/release.py verify

      # actions/attest-build-provenance v2.2.3, reviewed immutable commit.
      - uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2
        with:
          subject-path: ${{ env.RELEASE_OUTPUT_DIR }}/*

      - name: Publish frozen verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release/release.py publish

      - name: Remove temporary verification material
        if: ${{ always() }}
        run: python3 scripts/release/release.py cleanup-signing
