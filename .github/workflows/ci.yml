name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: macos-26
    steps:
      # actions/checkout v7.0.1, reviewed immutable commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Clean source audit
        run: ./scripts/clean-source-audit.sh
      - name: Validate release workflow
        run: ./scripts/release/validate-workflow.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  parrot:
    runs-on: macos-26
    defaults:
      run:
        working-directory: parrot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build
        run: swift build
      - name: Test
        run: swift test
