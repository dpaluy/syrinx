name: CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: macos-14
    steps:
      # Reviewed v4 tag, pinned to immutable commit 11d5960a326750d5838078e36cf38b85af677262.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Clean source audit
        run: ./scripts/clean-source-audit.sh
      - name: Check em dash characters
        run: "! rg -n '\\x{2014}' --hidden --glob '!.git/**' --glob '!.build/**' --glob '!**/.build/**' --glob '!scripts/clean-source-audit.sh' ."

  parrot:
    runs-on: macos-14
    defaults:
      run:
        working-directory: parrot
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build
        run: swift build
      - name: Test
        run: swift test
